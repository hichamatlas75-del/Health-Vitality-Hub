<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Health &amp; Vitality Hub - Jeûne, Nutrition &amp; Sport</title>

  <!-- PWA Manifest & Icônes -->
  <link rel="manifest" href="./manifest.webmanifest" />
  <meta name="theme-color" content="#090d16" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="VitalityHub" />
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <link rel="apple-touch-icon" href="./icons/icon-192.svg" />

  <!-- Description SEO & Métadonnées -->
  <meta name="description" content="Application PWA unifiée Santé & Vitalité : Suivi de jeûne intermittent, calculateur de glucides & charge glycémique marocaine, entraînements sportifs au poids du corps." />

  <!-- Typographies Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Feuilles de Styles CSS -->
  <link rel="stylesheet" href="./src/styles/base.css" />
  <link rel="stylesheet" href="./src/styles/components.css" />
  <link rel="stylesheet" href="./src/styles/dashboard.css" />
  <link rel="stylesheet" href="./src/styles/fasting.css" />
  <link rel="stylesheet" href="./src/styles/nutrition.css" />
  <link rel="stylesheet" href="./src/styles/workout.css" />
</head>
<body>

  <div id="app">
    <!-- BANNIÈRE INSTALLATION PWA -->
    <div id="pwaInstallBanner" class="pwa-banner">
      <span>Installez <strong>Vitality Hub</strong> sur votre téléphone pour un accès instantané hors-ligne.</span>
      <div class="pwa-banner-actions">
        <button id="btnPwaInstall" class="btn-primary btn-sm">Installer</button>
        <button id="btnPwaDismiss" class="btn-secondary btn-sm">Plus tard</button>
      </div>
    </div>

    <!-- EN-TÊTE FIXE SUPÉRIEUR -->
    <header class="top-header-bar">
      <div class="brand-wrapper">
        <img src="./favicon.svg" alt="Vitality Hub Logo" class="brand-logo-img" />
        <span class="brand-title">HEALTH &amp; VITALITY HUB</span>
      </div>
      <div class="header-status-area">
        <span id="offlineBadge" class="offline-badge" title="Fonctionnement hors-ligne autonome">Mode Hors-ligne 📶</span>
      </div>
    </header>

    <!-- ZONE DE CONTENU PRINCIPALE (ROUTAGE DYNAMIQUE SPA) -->
    <main id="viewContainer" class="view-viewport"></main>

    <!-- NAVIGATION INFÉRIEURE FIXE (BOTTOM NAVIGATION) -->
    <nav class="bottom-nav-bar" aria-label="Navigation principale">
      <button class="bottom-nav-item active" data-target="dashboard" aria-label="Tableau de bord">
        <div class="nav-icon-wrap">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>
        </div>
        <span class="nav-label">Dashboard</span>
      </button>

      <button class="bottom-nav-item" data-target="fasting" aria-label="Jeûne intermittent">
        <div class="nav-icon-wrap">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg>
        </div>
        <span class="nav-label">Jeûne</span>
      </button>

      <button class="bottom-nav-item" data-target="nutrition" aria-label="Nutrition & Glucides">
        <div class="nav-icon-wrap">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8h1a4 4 0 0 1 0 8h-1"/><path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"/><line x1="6" y1="1" x2="6" y2="4"/><line x1="10" y1="1" x2="10" y2="4"/><line x1="14" y1="1" x2="14" y2="4"/></svg>
        </div>
        <span class="nav-label">Nutrition</span>
      </button>

      <button class="bottom-nav-item" data-target="workout" aria-label="Sport et renforcement">
        <div class="nav-icon-wrap">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6.5 6.5 11 11"/><path d="m21 21-1-1"/><path d="m3 3 1 1"/><path d="m18 22 4-4"/><path d="m2 6 4-4"/><path d="m3 10 7-7"/><path d="m14 21 7-7"/></svg>
        </div>
        <span class="nav-label">Sport</span>
      </button>
    </nav>
  </div>

  <!-- SCRIPT PRINCIPAL SPA -->
  <script type="module" src="./src/main.js"></script>
</body>
</html>
