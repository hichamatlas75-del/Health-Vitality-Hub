<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Health &amp; Vitality Hub - Jeûne, Nutrition &amp; Sport</title>

  <!-- PWA Manifest & Icônes -->
  <link rel="manifest" href="./manifest.webmanifest" />
  <meta name="theme-color" content="#090d16" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="VitalityHub" />
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <link rel="apple-touch-icon" href="./icons/icon-192.svg" />

  <!-- Description SEO & Métadonnées -->
  <meta name="description" content="Application PWA unifiée Santé & Vitalité : Suivi de jeûne intermittent, calculateur de glucides & charge glycémique marocaine, entraînements sportifs au poids du corps." />

  <!-- Typographies Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Feuilles de Styles CSS -->
  <link rel="stylesheet" href="./src/styles/base.css" />
  <link rel="stylesheet" href="./src/styles/components.css" />
  <link rel="stylesheet" href="./src/styles/dashboard.css" />
  <link rel="stylesheet" href="./src/styles/cockpit.css" />
  <link rel="stylesheet" href="./src/styles/fasting.css" />
  <link rel="stylesheet" href="./src/styles/nutrition.css" />
  <link rel="stylesheet" href="./src/styles/workout.css" />
</head>
<body>

  <div id="app">
    <!-- BANNIÈRE INSTALLATION PWA -->
    <div id="pwaInstallBanner" class="pwa-banner">
      <span>Installez <strong>Vitality Hub</strong> sur votre téléphone pour un accès instantané hors-ligne.</span>
      <div class="pwa-banner-actions">
        <button id="btnPwaInstall" class="btn-primary btn-sm">Installer</button>
        <button id="btnPwaDismiss" class="btn-secondary btn-sm">Plus tard</button>
      </div>
    </div>

    <!-- EN-TÊTE FIXE SUPÉRIEUR -->
    <header class="top-header-bar">
      <div class="brand-wrapper">
        <img src="./favicon.svg" alt="Vitality Hub Logo" class="brand-logo-img" />
        <span class="brand-title">HEALTH &amp; VITALITY COCKPIT</span>
      </div>
      <div class="header-status-area">
        <span id="offlineBadge" class="offline-badge" title="Fonctionnement hors-ligne autonome">Mode Hors-ligne 📶</span>
      </div>
    </header>

    <!-- ZONE DE CONTENU PRINCIPALE (ROUTAGE DYNAMIQUE SPA) -->
    <main id="viewContainer" class="view-viewport"></main>

    <!-- NAVIGATION INFÉRIEURE FIXE (BOTTOM NAVIGATION) -->
    <nav class="bottom-nav-bar" aria-label="Navigation principale">
      <button class="bottom-nav-item active" data-target="dashboard" aria-label="Cockpit">
        <div class="nav-icon-wrap">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>
        </div>
        <span class="nav-label">Cockpit</span>
      </button>

      <button class="bottom-nav-item" data-target="objectifs" aria-label="Objectifs Journaliers">
        <div class="nav-icon-wrap">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg>
        </div>
        <span class="nav-label">Objectifs</span>
      </button>

      <button class="bottom-nav-item" data-target="cross" aria-label="Analyse Croisée">
        <div class="nav-icon-wrap">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><circle cx="19" cy="5" r="2"/><circle cx="5" cy="19" r="2"/><path d="M10.4 10.4 6.4 17.6"/><path d="m13.6 13.6 4-7.2"/><path d="m17.5 7 1.5-1.5"/></svg>
        </div>
        <span class="nav-label">Croisement</span>
      </button>

      <button class="bottom-nav-item" data-target="sources" aria-label="Sources & Backends">
        <div class="nav-icon-wrap">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14a9 3 0 0 0 18 0V5"/><path d="M3 12a9 3 0 0 0 18 0"/></svg>
        </div>
        <span class="nav-label">Sources</span>
      </button>
    </nav>
  </div>

  <!-- SCRIPT PRINCIPAL SPA -->
  <script type="module" src="./src/main.js"></script>
</body>
</html>
